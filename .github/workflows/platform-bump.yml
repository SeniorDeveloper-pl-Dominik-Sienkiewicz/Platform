name: Platform bump (reusable)

# Reusable kanał bumpu (Decyzja 5): uruchamia bin `platform-bump` (piny Gradle i npm, kanon frontendu,
# referencje reusable workflows, lockfile'y, verification-metadata) i otwiera PR z diffem. Caller planuje go
# cronem; wywołanie i uprawnienia: docs/reusable-workflows.md.
#
# Bin idzie z assetu NAJNOWSZEGO wydania w GitHub Releases (SHA256SUMS + atestacja), nie z node_modules repo ani
# z niesprawdzonego tagu npm: działa też w repo bez frontendu (Touchstone) i zawsze z aktualną logiką bumpu.
# Dwa joby: `bump` uruchamia kod zależności (npm, Gradle) z tokenem tylko do odczytu i oddaje diff jako patch;
# `pull-request` z prawem zapisu nakłada patch, pushuje gałąź i otwiera PR, nie uruchamiając nic z repo.
on:
  workflow_call:
    inputs:
      timeout-minutes:
        description: "Minutes before the job is cancelled; GitHub's default is 360. Raise it for a slower build."
        type: number
        default: 30
      version:
        description: "Platform version to bump to; empty takes the newest release of the current MAJOR."
        type: string
        default: ""
      java-version:
        description: "JDK that runs Gradle for the lockfile regeneration. Platform supports Gradle on Java 27 only (ADR-0034)."
        type: string
        default: "27"
      toolchain-java-version:
        description: "Toolchain JDK that seniordev.java-conventions compiles with; installed by setup-java, not Foojay."
        type: string
        default: "27"
      node-version:
        description: "Node.js version that runs the platform-bump bin and npm."
        type: string
        default: "24"
    secrets:
      gpr_token:
        description: "Classic PAT with read:packages for Platform's GitHub Packages (npm, Gradle) and its release notes. Without it the caller's automatic GITHUB_TOKEN is used."
        required: false
      bump_token:
        description: "Classic PAT with the repo and workflow scopes that pushes the bump branch and opens the pull request, so its CI runs. Without it GITHUB_TOKEN is used: the pull request runs no CI and leaves the workflow refs unchanged."
        required: false

permissions:
  contents: read

jobs:
  bump:
    name: Run platform-bump
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
      packages: read
    outputs:
      target: ${{ steps.bump.outputs.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Toolchain JDK z setup-java, nie z Foojay (patrz backend-ci.yml), plus JDK, na którym jedzie Gradle.
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        id: toolchain-jdk
        with:
          distribution: temurin
          java-version: ${{ inputs.toolchain-java-version }}
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
      - name: Expose the toolchain JDK to Gradle
        env:
          TOOLCHAIN_JDK: ${{ steps.toolchain-jdk.outputs.path }}
        run: |
          mkdir -p "${GRADLE_USER_HOME:-$HOME/.gradle}"
          echo "org.gradle.java.installations.paths=$TOOLCHAIN_JDK" >> "${GRADLE_USER_HOME:-$HOME/.gradle}/gradle.properties"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: "https://npm.pkg.github.com"
          scope: "@seniordeveloper-pl-dominik-sienkiewicz"

      - name: Run platform-bump
        id: bump
        env:
          VERSION: ${{ inputs.version }}
          NODE_AUTH_TOKEN: ${{ secrets.gpr_token || secrets.GITHUB_TOKEN }}
          GPR_TOKEN: ${{ secrets.gpr_token || secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.gpr_token || secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.gpr_token || secrets.GITHUB_TOKEN }}
        run: |
          # >>> start-bin
          set -euo pipefail
          read -r -a version <<< "$VERSION"
          # Bin startowy = asset versions NAJNOWSZEGO wydania z GitHub Releases, sprawdzony sumą z SHA256SUMS i atestacją
          # release.yml na tagu, zanim cokolwiek z niego ruszy; ten sam łańcuch co handoff binu. Bin ustala cel
          # i oddaje sterowanie binowi wydania docelowego (handoff, N-DX-4, też zweryfikowany), więc logika pochodzi
          # z celu także w repo bez frontendu; --report daje raport wpływu na to repo do opisu PR (N-REL-8).
          owner=SeniorDeveloper-pl-Dominik-Sienkiewicz
          releases="${PLATFORM_RELEASES_URL:-https://github.com/$owner/Platform/releases/download}"
          proto="=https"
          case "$releases" in file://*) proto="=file" ;; esac
          start=$(gh api "repos/$owner/Platform/releases/latest" --jq .tag_name)
          start=${start#v}
          if [[ ! "$start" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The newest Platform release has no X.Y.Z tag ($start), so there is no bin to start."
            exit 1
          fi
          cli="$RUNNER_TEMP/platform-cli"
          asset="seniordeveloper-pl-dominik-sienkiewicz-versions-$start.tgz"
          mkdir -p "$cli"
          curl -fsSL --proto "$proto" --proto-redir "$proto" "$releases/v$start/$asset" -o "$cli/$asset"
          curl -fsSL --proto "$proto" --proto-redir "$proto" "$releases/v$start/SHA256SUMS" -o "$cli/SHA256SUMS"
          expected=$(awk -v name="$asset" '$2 == name || $2 == "*" name { print $1 }' "$cli/SHA256SUMS")
          actual=$( (sha256sum "$cli/$asset" 2>/dev/null || shasum -a 256 "$cli/$asset") | awk '{ print $1 }')
          if [ -z "$expected" ] || [ "$expected" != "$actual" ]; then
            echo "::error::The release asset $asset of Platform $start does not match its SHA256SUMS, so the bump does not start."
            exit 1
          fi
          gh attestation verify "$cli/$asset" --repo "$owner/Platform" --source-ref "refs/tags/v$start" \
            --signer-workflow "$owner/Platform/.github/workflows/release.yml" > /dev/null
          tar -xzf "$cli/$asset" -C "$cli"
          echo "==> Starting the platform-bump of Platform $start, verified against its SHA256SUMS and attestation"
          bash "$cli/package/bin/platform-bump.sh" ${version[@]+"${version[@]}"} \
            --report="$RUNNER_TEMP/platform-bump-report.md" 2>&1 | tee "$RUNNER_TEMP/platform-bump.log"
          # <<< start-bin

      - name: Save the diff as a patch
        run: |
          mkdir -p "$RUNNER_TEMP/platform-bump"
          git add -A
          git diff --cached --binary > "$RUNNER_TEMP/platform-bump/bump.patch"
          cp "$RUNNER_TEMP/platform-bump.log" "$RUNNER_TEMP/platform-bump/bump.log"
          if [ -f "$RUNNER_TEMP/platform-bump-report.md" ]; then cp "$RUNNER_TEMP/platform-bump-report.md" "$RUNNER_TEMP/platform-bump/report.md"; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: platform-bump-${{ github.run_id }}
          path: ${{ runner.temp }}/platform-bump/
          retention-days: 1

  pull-request:
    name: Open the bump pull request
    needs: bump
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: platform-bump-${{ github.run_id }}
          path: ${{ runner.temp }}/platform-bump
      - name: Apply the bump
        env:
          PATCH: ${{ runner.temp }}/platform-bump/bump.patch
        run: |
          # >>> apply-patch
          # Patch pochodzi z joba, który uruchamia kod zależności (npm, Gradle), a ten job pushuje go PAT-em z prawem
          # do workflowów. Przechodzi więc tylko to, co platform-bump może zmienić: piny, lockfile'e, metadane
          # weryfikacji, wrapper Gradle, bloki agentów, pliki migracji; w workflowach wyłącznie referencje Platform
          # i wersje JDK, a gradle-wrapper.jar tylko taki, jaki Gradle publikuje dla starej albo nowej wersji wrappera.
          set -euo pipefail
          [ -s "$PATCH" ] || exit 0
          git apply --index "$PATCH"
          files=()
          while IFS= read -r -d '' file; do files+=("$file"); done < <(git diff --cached --name-only --no-renames -z)
          changed() { local file; for file in "${files[@]}"; do [ "$file" = "$1" ] && return 0; done; return 1; }
          problems=()
          allowed() {
            case "$1" in
              settings.gradle.kts | backend/settings.gradle.kts | backend/settings-gradle.lockfile) ;;
              gradle.properties | backend/gradle.properties | backend/*gradle.lockfile | backend/*verification-metadata.xml) ;;
              frontend/package.json | frontend/package-lock.json | .npmrc | frontend/.npmrc) ;;
              gradlew | gradlew.bat | gradle/wrapper/gradle-wrapper.properties | gradle/wrapper/gradle-wrapper.jar) ;;
              backend/gradlew | backend/gradlew.bat | backend/gradle/wrapper/gradle-wrapper.properties | backend/gradle/wrapper/gradle-wrapper.jar) ;;
              AGENTS.md | CLAUDE.md | backend/AGENTS.md | backend/CLAUDE.md | frontend/AGENTS.md | frontend/CLAUDE.md) ;;
              Dockerfile | backend/Dockerfile | .sdkmanrc | backend/.sdkmanrc) ;;
              .github/workflows/*.yml | .github/workflows/*.yaml) ;;
              *) return 1 ;;
            esac
          }
          q="'"
          workflow_lines=(
            "^[-+][[:space:]]*(-[[:space:]]+)?uses:[[:space:]]*(DominikSienkiewicz|SeniorDeveloper-pl-Dominik-Sienkiewicz)/Platform/\.github/workflows/[A-Za-z0-9_.-]+\.ya?ml@v[0-9]+(\.[0-9]+\.[0-9]+)?([[:space:]]+#.*)?$"
            "^[-+][[:space:]]*platform-ref:[[:space:]]*[\"$q]?v[0-9]+(\.[0-9]+\.[0-9]+)?[\"$q]?[[:space:]]*$"
            "^[-+][[:space:]]*(toolchain-)?java-version:[[:space:]]*[\"$q]?[0-9]+[\"$q]?[[:space:]]*$"
          )
          for file in "${files[@]}"; do
            if ! allowed "$file"; then problems+=("$file is not a file platform-bump changes"); continue; fi
            case "$file" in
              .github/workflows/*)
                while IFS= read -r line; do
                  ok=false
                  for pattern in "${workflow_lines[@]}"; do [[ "$line" =~ $pattern ]] && ok=true; done
                  "$ok" || problems+=("$file changes a line that is not a Platform workflow reference: $line")
                done < <(git diff --cached --no-renames -U0 -- "$file" | grep -E '^[-+]' | grep -vE '^(\+\+\+|---) (a/|b/|/dev/null)' || true)
                ;;
            esac
          done
          distributions="${GRADLE_DISTRIBUTIONS_URL:-https://services.gradle.org/distributions}"
          proto="=https"
          case "$distributions" in file://*) proto="=file" ;; esac
          gradle_version() { sed -n -E 's#^distributionUrl=.*gradle-([0-9.]+)-(bin|all)\.zip.*#\1#p' | head -1; }
          for dir in "" backend/; do
            props="${dir}gradle/wrapper/gradle-wrapper.properties"
            jar="${dir}gradle/wrapper/gradle-wrapper.jar"
            if { changed "${dir}gradlew" || changed "${dir}gradlew.bat"; } && ! changed "$props"; then
              problems+=("${dir}gradlew changes without a new Gradle version in $props")
            fi
            changed "$jar" || continue
            actual=""
            [ -f "$jar" ] && actual=$( (sha256sum "$jar" 2>/dev/null || shasum -a 256 "$jar") | awk '{ print $1 }')
            matches=false
            for version in "$([ -f "$props" ] && gradle_version < "$props")" "$(git show "HEAD:$props" 2>/dev/null | gradle_version)"; do
              [ -n "$version" ] && [ -n "$actual" ] || continue
              expected=$(curl -fsSL --proto "$proto" --proto-redir "$proto" "$distributions/gradle-$version-wrapper.jar.sha256" 2>/dev/null || true)
              [ "$expected" = "$actual" ] && matches=true
            done
            "$matches" || problems+=("$jar is not the wrapper jar Gradle publishes for the old or the new wrapper version")
          done
          if [ "${#problems[@]}" -gt 0 ]; then
            printf '::error::%s\n' "${problems[@]}"
            echo "::error::The bump patch changes more than platform-bump may change, so nothing is pushed. Run scripts/platform-bump.sh locally and review the diff."
            exit 1
          fi
          git reset -q
          # <<< apply-patch
      - name: Open the bump pull request
        env:
          TARGET: ${{ needs.bump.outputs.target }}
          BASE: ${{ github.ref_name }}
          BUMP_LOG: ${{ runner.temp }}/platform-bump/bump.log
          BUMP_REPORT: ${{ runner.temp }}/platform-bump/report.md
          BUMP_TOKEN: ${{ secrets.bump_token }}
          PUSH_TOKEN: ${{ secrets.bump_token || secrets.GITHUB_TOKEN }}
        run: |
          # >>> open-pr
          set -euo pipefail
          [ -n "$TARGET" ] || { echo "::error::platform-bump reported no target version"; exit 1; }
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 | tr -d '\n')"
          git_auth() { git -c "http.https://github.com/.extraheader=$auth" "$@"; }

          # GITHUB_TOKEN nie może pushować zmian w .github/workflows, więc bez PAT-a referencje zostają.
          note=""
          if [ -z "${BUMP_TOKEN:-}" ] && ! git diff --quiet -- .github/workflows; then
            git checkout -- .github/workflows
            note="The reusable workflow references were not moved: GITHUB_TOKEN may not push workflow changes. Add a bump_token secret (classic PAT with the repo and workflow scopes), or move them to v$TARGET by hand."
          fi
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "Already on Platform $TARGET; nothing to bump."
            exit 0
          fi
          branch="platform-bump/v$TARGET"
          # Gałąź z otwartym PR-em czeka na merge. Gałąź bez niego (nieudane `gh pr create`, zamknięty PR) to sierota:
          # ten przebieg ją zastępuje, bo inaczej każdy kolejny kończyłby się na zielono, nic nie robiąc.
          replace=""
          if git_auth ls-remote --exit-code --heads origin "$branch" > /dev/null 2>&1; then
            open=$(GH_TOKEN="$PUSH_TOKEN" gh pr list --head "$branch" --state open --json number --jq length)
            if [ "$open" != 0 ]; then
              echo "::notice::$branch already has an open pull request; merge or close it to bump again."
              exit 0
            fi
            echo "::warning::$branch exists without an open pull request, so this run replaces it."
            replace="--force"
          fi

          git switch -q -c "$branch"
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "chore(platform): bump Platform to $TARGET"
          git_auth push -q ${replace:+"$replace"} origin "$branch"

          # GitHub odrzuca treść PR-a powyżej 65 536 znaków. Budżet liczy bajty (znak UTF-8 to co najmniej bajt), raport
          # dostaje początek, log koniec; cięcie zawsze z widoczną notą i bez połówki znaku wielobajtowego.
          body="$RUNNER_TEMP/platform-bump-pr.md"
          body_limit=60000
          report_limit=40000
          head_bytes() { python3 -c 'import sys; n = int(sys.argv[1]); sys.stdout.write(sys.stdin.buffer.read()[:max(n, 0)].decode("utf-8", "ignore"))' "$1"; }
          tail_bytes() { python3 -c 'import sys; n = int(sys.argv[1]); data = sys.stdin.buffer.read(); sys.stdout.write(data[len(data) - n:].decode("utf-8", "ignore") if n > 0 else "")' "$1"; }
          {
            echo "Bumps Platform to $TARGET with \`platform-bump\`: the Gradle and npm pins, the frontend canon,"
            echo "the reusable workflow references, the lockfiles and the dependency verification metadata."
            if [ -n "$note" ]; then echo; echo "> $note"; fi
            echo
            # Raport wpływu (platform-bump --report): co z wydań dotyczy tego repo, czego tu nie ma, co wymaga akcji.
            if [ -s "${BUMP_REPORT:-}" ]; then
              if [ "$(wc -c < "$BUMP_REPORT")" -gt "$report_limit" ]; then
                head_bytes "$report_limit" < "$BUMP_REPORT"
                echo
                echo
                echo "> The impact report is cut to fit GitHub's pull request size limit; the full report is in this run's platform-bump artifact."
              else
                cat "$BUMP_REPORT"
              fi
              echo
            fi
            echo "Review the release notes and the consumer actions below before merging."
            echo
          } > "$body"
          log_limit=$((body_limit - $(wc -c < "$body") - 300))
          {
            if [ "$(wc -c < "$BUMP_LOG")" -gt "$log_limit" ]; then
              echo "> The bump log is cut to fit GitHub's pull request size limit; its start is in the log of the Run platform-bump job."
              echo
            fi
            echo '```text'
            tail_bytes "$log_limit" < "$BUMP_LOG"
            echo '```'
          } >> "$body"
          if ! GH_TOKEN="$PUSH_TOKEN" gh pr create --base "$BASE" --head "$branch" \
            --title "chore(platform): bump Platform to $TARGET" --body-file "$body"; then
            git_auth push -q origin --delete "$branch" || true
            echo "::error::The pull request for $branch could not be created, so the branch was deleted again and the next run retries."
            exit 1
          fi
          if [ -z "${BUMP_TOKEN:-}" ]; then
            echo "::warning::The pull request was opened with GITHUB_TOKEN, so its CI does not start. Add a bump_token secret to run it."
          fi
          # <<< open-pr
